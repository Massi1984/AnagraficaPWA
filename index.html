<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width,initial-scale=1">

    <title>Anagrafica Enterprise V3</title>

    <meta name="theme-color" content="#0078D4">

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">

    <!-- Excel Export -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

    <!-- PDF Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

</head>

<body>

    <div class="container">

        <!-- ================================================== -->
        <!-- HEADER -->
        <!-- ================================================== -->

        <header class="header-card">

            <div class="header-top">

                <div>

                    <h1>
                        👥 Anagrafica Enterprise
                    </h1>

                    <p class="subtitle">
                        Gestione Persone, Aziende e Contatti
                    </p>

                </div>

                <button
                    id="toggleTheme"
                    class="btn btn-secondary">

                    🌙 Dark Mode

                </button>

            </div>

        </header>

        <!-- ================================================== -->
        <!-- TOOLBAR -->
        <!-- ================================================== -->

        <section class="toolbar-card">

            <button id="newBtn"
                class="btn btn-primary">

                ➕ Nuovo

            </button>

            <button id="saveBtn"
                class="btn btn-success">

                💾 Salva

            </button>

            <button id="excelBtn"
                class="btn">

                📊 Excel

            </button>

            <button id="pdfBtn"
                class="btn">

                📄 PDF

            </button>

            <button id="backupBtn"
                class="btn">

                ☁ Backup

            </button>

            <button id="restoreBtn"
                class="btn">

                📂 Ripristina

            </button>

            <input
                type="file"
                id="restoreFile"
                hidden
                accept=".json">

        </section>

        <!-- ================================================== -->
        <!-- DASHBOARD -->
        <!-- ================================================== -->

        <section class="dashboard-grid">

            <div class="kpi-card">

                <div class="kpi-value"
                    id="totalPeople">

                    0

                </div>

                <div class="kpi-label">

                    Persone

                </div>

            </div>

            <div class="kpi-card">

                <div class="kpi-value"
                    id="totalCompanies">

                    0

                </div>

                <div class="kpi-label">

                    Aziende

                </div>

            </div>

            <div class="kpi-card">

                <div class="kpi-value"
                    id="totalEmails">

                    0

                </div>

                <div class="kpi-label">

                    Email

                </div>

            </div>

            <div class="kpi-card">

                <div class="kpi-value"
                    id="totalPhones">

                    0

                </div>

                <div class="kpi-label">

                    Telefoni

                </div>

            </div>

            <div class="kpi-card">

                <div class="kpi-value"
                    id="totalPhotos">

                    0

                </div>

                <div class="kpi-label">

                    Foto

                </div>

            </div>

            <div class="kpi-card">

                <div class="kpi-value"
                    id="averageAge">

                    -

                </div>

                <div class="kpi-label">

                    Età Media

                </div>

            </div>

        </section>

        <!-- ================================================== -->
        <!-- SEARCH -->
        <!-- ================================================== -->

        <section class="card">

            <h2>
                🔍 Ricerca Avanzata
            </h2>

            <div class="search-grid">

                <input
                    type="text"
                    id="searchNome"
                    placeholder="Nome">

                <input
                    type="text"
                    id="searchCognome"
                    placeholder="Cognome">

                <input
                    type="text"
                    id="searchAzienda"
                    placeholder="Azienda">

                <input
                    type="text"
                    id="searchCitta"
                    placeholder="Città">

                <input
                    type="text"
                    id="searchEmail"
                    placeholder="Email">

                <select id="searchFoto">

                    <option value="">
                        Tutte
                    </option>

                    <option value="yes">
                        Con Foto
                    </option>

                    <option value="no">
                        Senza Foto
                    </option>

                </select>

            </div>

        </section>

        <!-- ================================================== -->
        <!-- FORM -->
        <!-- ================================================== -->

        <section class="card">

            <h2>
                📝 Scheda Persona
            </h2>

            <input
                type="hidden"
                id="recordId">

            <div class="form-grid">

                <div>

                    <label>Nome *</label>

                    <input
                        type="text"
                        id="nome"
                        required>

                </div>

                <div>

                    <label>Cognome *</label>

                    <input
                        type="text"
                        id="cognome"
                        required>

                </div>

                <div>

                    <label>Data Nascita</label>

                    <input
                        type="date"
                        id="dataNascita">

                </div>

                <div>

                    <label>Email</label>

                    <input
                        type="email"
                        id="email">

                </div>

                <div>

                    <label>Telefono</label>

                    <input
                        type="text"
                        id="telefono">

                </div>

                <div>

                    <label>Codice Fiscale</label>

                    <input
                        type="text"
                        id="codiceFiscale">

                </div>

                <div>

                    <label>Azienda</label>

                    <input
                        type="text"
                        id="azienda">

                </div>

                <div>

                    <label>Città</label>

                    <input
                        type="text"
                        id="citta">

                </div>

                <div class="full-width">

                    <label>Indirizzo</label>

                    <input
                        type="text"
                        id="indirizzo">

                </div>

                <div class="full-width">

                    <label>Note</label>

                    <textarea
                        id="note"
                        rows="5"></textarea>

                </div>

            </div>

            <!-- FOTO -->

            <div class="photo-section">

                <h3>
                    📷 Foto Profilo
                </h3>

                <input
                    type="file"
                    id="foto"
                    accept="image/*">

                <div
                    id="photoPreview"
                    class="preview-box">

                </div>

            </div>

        </section>

        <!-- ================================================== -->
        <!-- TABLE -->
        <!-- ================================================== -->

        <section class="card">

            <div class="table-header">

                <h2>
                    📋 Elenco Persone
                </h2>

                <span
                    id="recordCount">

                    0 Record

                </span>

            </div>

            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>Foto</th>

                            <th data-sort="nome">
                                Nome
                            </th>

                            <th data-sort="cognome">
                                Cognome
                            </th>

                            <th data-sort="azienda">
                                Azienda
                            </th>

                            <th data-sort="citta">
                                Città
                            </th>

                            <th data-sort="email">
                                Email
                            </th>

                            <th data-sort="telefono">
                                Telefono
                            </th>

                            <th>
                                Azioni
                            </th>

                        </tr>

                    </thead>

                    <tbody id="peopleTable">

                    </tbody>

                </table>

            </div>

        </section>

    </div>

    <!-- ================================================== -->
    <!-- JAVASCRIPT -->
    <!-- ================================================== -->

<script src="utils.js"></script>

<script src="db.js"></script>

<script src="backup.js"></script>

<script src="export.js"></script>

<!-- <script src="app.js"></script> -->

<script src="app_v3.js"></script>

</body>

</html>
